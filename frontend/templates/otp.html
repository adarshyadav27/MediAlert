<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify mobile | MediAlert</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center p-4 text-slate-900">
  <main class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 sm:p-10">
    <div class="text-emerald-700 text-xs font-bold tracking-widest uppercase">MediAlert / Secure access</div>
    <h1 class="font-heading text-3xl font-bold mt-5">Verify your mobile</h1>
    <p class="text-sm text-slate-500 mt-2">Enter the 6-digit code sent to your mobile. For local presentation, the code is also printed in the backend terminal if SMS delivery is unavailable.</p>
    {% if error %}<div class="mt-5 p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-sm">{{ error }}</div>{% endif %}
    <form method="post" class="mt-7 space-y-4"><label class="block text-sm font-semibold">One-time password<input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus class="mt-2 w-full rounded-xl border border-slate-300 p-4 text-center text-2xl tracking-[0.5em] focus:border-emerald-600 outline-none"></label><button class="w-full rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5">Verify and continue</button></form>
    <form method="post" action="{{ url_for('send_otp') }}" class="mt-3"><button class="w-full rounded-xl border border-slate-300 text-slate-700 font-semibold py-3">Send code again</button></form>
    <a href="{{ url_for('logout') }}" class="block text-center text-sm text-slate-500 hover:text-red-600 mt-6">Cancel</a>
  </main>
</body>
</html>
